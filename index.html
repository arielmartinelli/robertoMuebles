<!doctype html>
<html lang="es-AR" data-mode="residencial">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chape | Muebles a medida en melamina · Diseño y fabricación en Córdoba</title>
    <meta name="description" content="Estudio-taller en Córdoba. Diseñamos y fabricamos muebles a medida en melamina para casas y comercios: cocinas, placares, locales, mostradores e islas de shopping. Presupuesto online al instante." />
    <meta name="theme-color" content="#1c1d1b" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chape" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Chape | Diseño + Fabricación de muebles a medida" />
    <meta property="og:description" content="Muebles a medida en melamina para casas y comercios en Córdoba. Diseñamos y fabricamos en taller propio." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <!-- WhatsApp y redes necesitan la dirección completa de la imagen (con dominio). El dominio se define en vite.config.ts -->
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg?v=2" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%/og-image.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chape, diseño y fabricación de muebles a medida" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg?v=2" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Evita el parpadeo de colores: aplica el modo guardado antes de pintar -->
    <script>
      (function () {
        try {
          var m = new URLSearchParams(location.search).get('modo') || localStorage.getItem('chape-modo');
          if (m === 'comercial' || m === 'residencial') document.documentElement.dataset.mode = m;
        } catch (e) {}
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FurnitureStore",
        "name": "Chape",
        "description": "Estudio-taller de diseño y fabricación de muebles a medida en melamina, residenciales y comerciales.",
        "areaServed": "Córdoba, Argentina",
        "address": { "@type": "PostalAddress", "addressLocality": "Córdoba", "addressCountry": "AR" },
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/og-image.jpg"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Chape: diseño y fabricación de muebles a medida en Córdoba. Activá JavaScript para usar el presupuestador.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
